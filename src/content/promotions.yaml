# Promocje – rabat na stronie liczony jest automatycznie na przykładowej pozycji z cennika (`example`).
# Rabaty nie łączą się ze sobą.

si-polecajka:
  title: Si-Polecajka
  order: 1
  badge: −15%
  percent: 15
  summary: Poleć nasz gabinet bliskiej osobie i otrzymaj dodatkową zniżkę −15% na dowolny zabieg z naszej oferty.
  steps:
    - Poleć Si Skin przyjaciółce, znajomej lub komuś bliskiemu.
    - Osoba z Twojego polecenia odbywa u nas zabieg przed Twoją kolejną wizytą.
    - Podczas swojej wizyty podaj imię osoby, która przyszła z Twojego polecenia, i zgłoś chęć skorzystania ze zniżki.
  terms:
    - Zniżka obejmuje dowolnie wybrany zabieg z oferty gabinetu.
    - Zgłoś nam chęć skorzystania ze zniżki przy wizycie, po spełnieniu warunków promocji.
    - Zniżkę −15% otrzymujesz jednorazowo – kolejne polecenia nie dają następnych zniżek.
    - Przy wizycie podaj imię osoby, która przyszła z Twojego polecenia.
    - Rabaty nie łączą się ze sobą.
  example:
    category: epilacja-shr
    item: Bikini głębokie (+ szpara pośladkowa)
  highlight: true

si-opinia:
  title: Si-Opinia
  order: 2
  badge: −10%
  percent: 10
  summary: Wystaw nam łącznie 3 opinie – na Booksy, Google lub Facebooku – pokaż je w gabinecie i odbierz −10% na dowolny zabieg z naszej oferty.
  steps:
    - Wystaw łącznie 3 opinie o naszym gabinecie na Booksy, Google lub Facebooku.
    - Pokaż nam opinie podczas wizyty w gabinecie i odbierz zniżkę.
  terms:
    - Zniżka obejmuje dowolnie wybrany zabieg z oferty gabinetu.
    - Zgłoś nam chęć skorzystania ze zniżki przy wizycie, po spełnieniu warunków promocji.
    - Warunkiem promocji są łącznie 3 opinie okazane w gabinecie.
    - Rabaty nie łączą się ze sobą.
  example:
    category: rozjasnianie-przebarwien
    item: Twarz

si-selfie:
  title: Si-Selfie
  order: 3
  badge: −5%
  percent: 5
  summary: Zrób sobie zdjęcie w naszym gabinecie, oznacz nas na Instagramie lub Facebooku i odbierz −5% na dowolny zabieg z naszej oferty.
  steps:
    - Zrób sobie zdjęcie w naszym gabinecie.
    - Opublikuj je na Instagramie lub Facebooku i oznacz nas (@siskin.wroclaw).
    - Zgłoś nam przy wizycie chęć skorzystania ze zniżki.
  terms:
    - Zniżka obejmuje dowolnie wybrany zabieg z oferty gabinetu.
    - Zgłoś nam chęć skorzystania ze zniżki przy wizycie, po spełnieniu warunków promocji.
    - Zdjęcie powinno powstać w naszym gabinecie, a w publikacji oznaczasz nas na Instagramie lub Facebooku.
    - Rabaty nie łączą się ze sobą.
  example:
    category: epilacja-shr
    item: Pachy
