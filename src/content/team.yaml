    - Modelowanie ust
    - Stymulatory tkankowe
  bio: >-
    Pasjonatka sfery Beauty, nieustannie poszukująca nowych rozwiązań, stawiająca siłę
    i dobro kobiet na pierwszym miejscu. Z zamiłowania do zdrowej, pięknej i promiennej
    skóry postanowiła otworzyć własny gabinet laseroterapii i kosmetologii estetycznej.
    Jej wizytówką są laser SHR EPIL MOTION, delikatna i subtelna medycyna estetyczna oraz
    pełen profesjonalizm. Zwolnij i znajdź chwilę tylko dla siebie. Powiedz TAK swojej skórze.
  photo: ../assets/images/weronika-grincewicz.jpg
  photoAlt: Weronika Grincewicz – właścicielka gabinetu Si Skin

