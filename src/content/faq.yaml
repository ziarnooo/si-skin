f01:
  category: pierwsza-wizyta
  order: 1
  q: Jak umówić wizytę?
  a: Najwygodniej przez Booksy (rezerwacja online) lub telefonicznie pod numerem 694 642 573. Wizyty realizujemy wyłącznie po wcześniejszej rezerwacji.

f02:
  category: pierwsza-wizyta
  order: 2
  q: Nie widzę wolnego terminu. Co zrobić?
  a: Zadzwoń do nas pod numer 694 642 573 – czasami potrafimy zdziałać cuda, a część godzin nie jest widoczna online.

f03:
  category: pierwsza-wizyta
  order: 3
  q: Czy konsultacja jest bezpłatna?
  a: Tak, bezpłatna konsultacja trwa 20 minut – rozwiejemy wątpliwości, ustalimy plan działania i dobierzemy odpowiednią terapię dla Twojej skóry. Dostępna jest też konsultacja z planem pielęgnacyjnym (199 zł, 30 min), którą dodajemy gratis do wybranego zabiegu.

f04:
  category: pierwsza-wizyta
  order: 4
  q: Jak przygotować się do pierwszej wizyty?
  a: Przed depilacją laserową zostaw odrost 2–3 mm (nie goląc się na gładko), nie depiluj się woskiem ani pęsetą na 2–3 tygodnie przed zabiegiem i nie opalaj skóry na ok. 2–5 dni przed wizytą. Przyjdź zdrowa – bez przyjmowania leków przeciwzapalnych i antybiotyków. Pytania o przygotowanie do innych zabiegów możesz zadać telefonicznie.

f05:
  category: pierwsza-wizyta
  order: 5
  q: Jak wygląda pierwsza wizyta?
  a: Zaczynamy od wywiadu i oceny stanu skóry, następnie ustalamy plan działania i dobieramy terapię. Przy depilacji laserowej dokładny plan serii zabiegów ustalamy właśnie na pierwszej wizycie.

f06:
  category: pierwsza-wizyta
  order: 6
  q: Czy mogę zapłacić kartą?
  a: Tak, w gabinecie akceptujemy karty płatnicze.

f07:
  category: pierwsza-wizyta
  order: 7
  q: Czy jest parking i czy gabinet jest dostępny dla osób z niepełnosprawnościami?
  a: Tak – dla klientów dostępny jest parking, a gabinet jest dostępny dla osób z niepełnosprawnościami. Do dyspozycji jest też Wi-Fi.

f08:
  category: depilacja
  order: 8
  q: Czy depilacja laserowa boli?
  a: Większość klientek opisuje zabieg jako komfortowy i praktycznie bezbolesny. Laser SHR w metodzie In Motion podgrzewa mieszek stopniowo, a schłodzona głowica chroni skórę.

f09:
  category: depilacja
  order: 9
  q: Ile zabiegów depilacji laserowej potrzebuję i jak często się odbywają?
  a: Zwykle 7–9 wizyt w odstępach co 4–12 tygodni. Odstępy ustalamy indywidualnie podczas wizyty, dopasowując je do cyklu wzrostu włosa, a dokładny plan ustalamy na pierwszej wizycie.

f10:
  category: depilacja
  order: 10
  q: Kiedy zobaczę efekty depilacji laserowej?
  a: Pierwsze efekty są widoczne już po pierwszym zabiegu. Z każdą kolejną wizytą owłosienie jest wyraźnie rzadsze i cieńsze.

f11:
  category: depilacja
  order: 11
  q: Jakie są przeciwwskazania do depilacji laserowej?
  a: Do najważniejszych należą ciąża i karmienie piersią, antybiotyki (od ostatniej dawki muszą minąć co najmniej 2 tygodnie), leki światłouczulające, choroby skóry, choroby serca oraz rozrusznik serca i inne urządzenia medyczne. Pełną listę znajdziesz na stronie depilacji laserowej SHR, a przed pierwszym zabiegiem zawsze przeprowadzamy wywiad.

f12:
  category: depilacja
  order: 12
  q: Czy mogę się opalać w trakcie serii zabiegów?
  a: Tak, ale z przerwą – nie opalaj skóry na ok. 2–5 dni przed zabiegiem i bezpośrednio po nim. Po intensywnej opaleniźnie zabieg wykonujemy nie wcześniej niż 1–2 tygodnie od ostatniej ekspozycji; samoopalacz również wymaga kilkudniowej przerwy.

f13:
  category: depilacja
  order: 13
  q: Jak długi powinien być odrost w dniu zabiegu?
  a: Zostaw odrost 2–3 mm – skóra nie powinna być gładko ogolona. Na 2–3 tygodnie przed zabiegiem nie używaj wosku ani pęsety.

f14:
  category: depilacja
  order: 14
  q: Czy laser działa na jasne i rude włosy?
  a: Tak. Technologia SHR usuwa włosy w różnych kolorach – od jasnego blondu, przez rude, po czarne – i jest dostosowana do wszystkich typów karnacji.

f15:
  category: depilacja
  order: 15
  q: Czy depilację laserową mogą wykonać mężczyźni?
  a: Tak. Mężczyźni korzystają z technologii SHR najczęściej do usunięcia owłosienia z klatki piersiowej, pleców, pach oraz karku.

f16:
  category: depilacja
  order: 16
  q: Czy są pakiety na serię zabiegów?
  a: Tak – pakiety na serię zabiegów depilacji laserowej kupisz na miejscu w gabinecie. Zapytaj o nie podczas wizyty lub bezpłatnej konsultacji.

f17:
  category: promocje
  order: 17
  q: Jak mogę odebrać zniżkę?
  a: Zgłoś nam przy wizycie chęć skorzystania ze zniżki – po spełnieniu warunków danej promocji.

f18:
  category: promocje
  order: 18
  q: Na jakie zabiegi obowiązują zniżki?
  a: Zniżki Si-Selfie, Si-Opinia i Przyjaciółka-Polecajka możesz odebrać na dowolnie wybrany zabieg z oferty gabinetu. Karta stałego klienta daje zniżki na zabiegi depilacji laserowej.

f19:
  category: promocje
  order: 19
  q: Jak działa Si-Selfie (−5%)?
  a: Zrób sobie zdjęcie w naszym gabinecie i oznacz nas na Instagramie (@siskin.wroclaw) lub Facebooku. Po spełnieniu warunków zgłoś to przy wizycie i odbierz −5% na wybrany zabieg.

f20:
  category: promocje
  order: 20
  q: Jak działa Si-Opinia (−10%)?
  a: Wystaw nam 3 opinie – na Booksy, Google i Facebooku – a następnie zgłoś to przy wizycie, aby odebrać −10% na wybrany zabieg.

f21:
  category: promocje
  order: 21
  q: Jak działa Przyjaciółka-Polecajka (−15%)?
  a: Jeśli osoba z Twojego polecenia odbędzie u nas zabieg przed Twoją kolejną wizytą, otrzymasz −15% na dowolny zabieg. Przy wizycie podaj imię polecanej osoby; zniżkę z jednego polecenia można wykorzystać tylko raz.

f22:
  category: promocje
  order: 22
  q: Czym jest karta stałego klienta?
  a: To oferta zniżek na zabiegi depilacji laserowej dla stałych klientów. Zapytaj o nią w gabinecie przy najbliższej wizycie.

f23:
  category: karty
  order: 23
  q: Jak długo ważna jest karta podarunkowa?
  a: Voucher podarunkowy jest ważny przez 6 miesięcy.

f24:
  category: karty
  order: 24
  q: Czy voucher można spersonalizować i gdzie go kupić?
  a: Tak – przygotowujemy personalizowany voucher na wybrany zabieg lub na określoną kwotę. Kartę podarunkową kupisz bezpośrednio w naszym gabinecie.

f25:
  category: ogolne
  order: 25
  q: Kto wykonuje zabiegi?
  a: Zabiegi wykonują nasze dyplomowane kosmetolożki.

f26:
  category: ogolne
  order: 26
  q: Na jakim laserze pracujecie?
  a: Pracujemy na multifunkcyjnej platformie SHR EPIL MOTION firmy Ganc-Med, przeznaczonej zarówno dla kobiet, jak i dla mężczyzn. Laser objęty jest stałą opieką techniczną serwisu GANC-SERVICE, a lampa w głowicy zabiegowej jest regularnie wymieniana.

f27:
  category: ogolne
  order: 27
  q: Czy w ciąży można wykonywać zabiegi laserowe?
  a: Nie jest to wskazane – ciąża i karmienie piersią są przeciwwskazaniami, a brakuje badań potwierdzających pełne bezpieczeństwo zabiegów laserowych dla płodu. W ciąży skóra jest też bardziej wrażliwa, dlatego zabiegi laserowe warto wykonać dopiero po ciąży; o bezpiecznych zabiegach pielęgnacyjnych porozmawiaj z lekarzem i kosmetologiem.

f28:
  category: ogolne
  order: 28
  q: Gdzie znajduje się gabinet?
  a: Gabinet Si Skin mieści się przy ul. Królewieckiej 121/3 we Wrocławiu (54-117, dzielnica Fabryczna). Aktualne godziny otwarcia znajdziesz na stronie kontaktowej i w Booksy, a w razie pytań zadzwoń pod numer 694 642 573.
