  # ═══════════════════════════ BLOG ═══════════════════════════
  - name: blog
    label: Blog
    label_singular: Artykuł
    icon: article
    description: Artykuły publikowane są pod adresem /blog/nazwa-pliku/.
    folder: src/content/blog
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{title}}'
    media_folder: src/assets/blog
    public_folder: ../../assets/blog
    sortable_fields: [pubDate, title]
    fields:
      - { name: title, label: Tytuł artykułu, widget: string }
      - { name: description, label: Krótki opis (Google i lista artykułów), widget: text, hint: 'Do ok. 160 znaków.' }
      - { name: pubDate, label: Data publikacji, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD' }
      - { name: updatedDate, label: Data aktualizacji, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD', required: false }
      - { name: image, label: Zdjęcie główne, widget: image }
      - { name: imageAlt, label: Opis zdjęcia, widget: string }
      - name: service
        label: Powiązany zabieg
        widget: relation
        collection: zabiegi
        value_field: '{{slug}}'
        search_fields: [title, navTitle]
        display_fields: [navTitle]
        required: false
        hint: 'Pod artykułem pojawi się link do tego zabiegu.'
      - { name: draft, label: Wersja robocza (nie publikuj), widget: boolean, default: false }
      - { name: body, label: Treść artykułu, widget: markdown, hint: 'Linki do stron serwisu wpisuj jako /nazwa-strony/ (bez adresu domeny).' }

  # ═══════════════════════════ STRONY ═══════════════════════════
  - name: strony
    label: Strony (regulamin, polityka prywatności)
    label_singular: Strona
    icon: description
    folder: src/content/pages
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{title}}'
    fields:
      - { name: title, label: Tytuł strony, widget: string }
      - { name: description, label: Krótki opis (Google), widget: text }
      - { name: updatedDate, label: Data aktualizacji, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD', required: false }
      - { name: body, label: Treść strony, widget: markdown }
