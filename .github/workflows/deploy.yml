name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Przy przeprowadzce na własną domenę ustaw zmienne repozytorium (Settings → Variables):
  # SITE_URL=https://www.si-skin.pl, BASE_PATH=/
  SITE_URL: ${{ vars.SITE_URL || 'https://ziarnooo.github.io' }}
  BASE_PATH: ${{ vars.BASE_PATH || '/si-skin' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v5
        with:
          # package.json → engines.node wymaga >=22.23.4; Node 24 (LTS) to spełnia.
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
